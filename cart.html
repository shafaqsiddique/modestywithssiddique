<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | Modest with Siddique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fdf5eb; color: #2c2c2c; padding: 20px; }
        .cart-container { max-width: 800px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-family: 'Playfair Display', serif; text-align: center; margin-bottom: 30px; border-bottom: 2px solid gold; padding-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .item-info { flex: 2; }
        .item-price { font-weight: bold; }
        .remove-btn { color: red; cursor: pointer; border: none; background: none; font-size: 12px; margin-left: 20px; }
        .total-section { text-align: right; margin-top: 30px; font-size: 20px; font-weight: bold; }
        .checkout-btn { background: #1a1a1a; color: white; border: none; padding: 15px 40px; width: 100%; cursor: pointer; margin-top: 20px; font-weight: bold; letter-spacing: 1px; transition: 0.3s; }
        .checkout-btn:hover { background: #444; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="cart-container">
        <h1>Shopping Bag</h1>
        
        <div id="cart-items-list"></div>

        <div class="total-section">
            Total: ₹<span id="grand-total">0</span>
        </div>

        <button class="checkout-btn" onclick="window.location.href='checkout.html'">PROCEED TO CHECKOUT</button>
        <a href="index.html" class="back-link">← Back to Shopping</a>
    </div>

    <script>
        // 1. Storage se data nikaal kar screen par dikhana
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('myAbayaCart')) || [];
            let list = document.getElementById('cart-items-list');
            let total = 0;
            list.innerHTML = "";

            if (cart.length === 0) {
                list.innerHTML = "<p style='text-align:center;'>Aapka bag khali hai.</p>";
            } else {
                cart.forEach((item, index) => {
                    total += item.price * item.quantity;
                    list.innerHTML += `
                        <div class="cart-item">
                            <div class="item-info">
                                <strong>${item.name}</strong><br>
                                <small>Quantity: ${item.quantity}</small>
                            </div>
                            <div class="item-price">₹${item.price * item.quantity}</div>
                            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                        </div>`;
                });
            }
            document.getElementById('grand-total').innerText = total;
        }

        // 2. Specific item hatane ka logic
        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('myAbayaCart')) || [];
            cart.splice(index, 1); // Array se item delete
            localStorage.setItem('myAbayaCart', JSON.stringify(cart));
            loadCart(); // List refresh karein
        }

        // Page load hote hi cart dikhao
        window.onload = loadCart;
    </script>

</body>
</html>
