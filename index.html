<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modest with Siddique</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f1dbc1; /* Aapke screenshot wala cream color */
            overflow-x: hidden;
        }

        /* Header Styling */
        header {
            background-color: #1a1a1a; /* Black Header */
            color: white;
            padding: 20px 0;
            width: 100%;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin-left: 25px;
        }

        nav ul li a {
            color: #d1d1d1;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: white;
        }

        /* Hero Section Styling */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1100px;
            margin: 80px auto;
            padding: 0 20px;
            gap: 40px;
        }

        .hero-content {
            flex: 1;
        }

        .hero-content h1 {
            font-size: 55px;
            color: #1a1a1a;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            background-color: #111;
            color: white;
            padding: 14px 30px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #333;
        }

        /* Image Styling */
        .hero-image {
            flex: 1;
            text-align: right;
        }

        .hero-image img {
            width: 100%;
            max-width: 450px;
            border-radius: 20px; 
            box-shadow: 15px 15px 0px rgba(0,0,0,0.05);
        }

        
        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                margin: 40px auto;
            }
            .hero-image {
                text-align: center;
            }
            .hero-content h1 {
                font-size: 35px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">Modest with Siddique</div>
            <nav>
                <ul>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Abaya Store & <br> Modest Wear</h1>
            <p>Ensuring you feel your best with our <br> premium modest supplies.</p>
            <button class="btn">View More</button>
        </div>
        <div class="hero-image">
            <img src="1000107881.jpeg" alt="Elegant Abaya">
        </div>
    </section>

</body>
</html>
